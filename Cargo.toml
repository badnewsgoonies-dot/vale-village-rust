[package]
name = "vale_village"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "vorbis",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
rand = "0.8"
dirs = "5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
